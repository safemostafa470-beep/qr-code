<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة البيانات والباركود الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #0284c7;
            --danger: #e11d48;
            --success: #059669;
            --warning: #d97706;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-color); margin: 0; padding: 0; direction: rtl; color: var(--text-main); }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .login-card {
            background: var(--card-bg); padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 380px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); text-align: center;
        }
        .login-card h3 { margin-bottom: 20px; color: var(--text-main); font-size: 20px; font-weight: 900; transition: 0.3s; }
        .login-card input { 
            width: 100%; padding: 12px 15px; margin-bottom: 12px; border: 2px solid #cbd5e1; 
            border-radius: 12px; font-size: 14px; text-align: center; background: #f8fafc; transition: 0.3s;
        }
        .login-card input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .remember-me { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; font-size: 13px; color: var(--text-secondary); font-weight: 700; cursor: pointer; }
        .remember-me input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; cursor: pointer; }

        .login-card button { 
            width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 12px; 
            font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; 
        }
        .login-card button:hover { background: var(--primary-hover); }
        #loginError { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; font-weight: 600; background: #fff1f2; padding: 8px; border-radius: 6px; }

        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 2px; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: none; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; border-bottom: 1px solid #cbd5e1; padding-bottom: 2px; }
        .top-bar h2 { font-size: 11px; color: var(--primary); margin: 0; font-weight: 900; }
        .logout-btn { background: #ffe4e6; color: var(--danger); border: none; padding: 2px 5px; border-radius: 4px; font-size: 8px; font-weight: 700; cursor: pointer; }

        #adminPanel { display: none; background: #f8fafc; padding: 4px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 4px; }
        #adminPanel h3 { margin-top: 0; color: var(--primary); font-size: 10px; font-weight: 800; margin-bottom: 4px; }
        
        .admin-nav-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
        .admin-tab-btn { flex: 1; padding: 4px; background: #e2e8f0; border: none; border-radius: 4px; font-size: 8px; font-weight: 700; cursor: pointer; color: var(--text-secondary); text-align: center; }
        .admin-tab-btn.active { background: var(--primary); color: #fff; }

        .admin-section { display: none; background: #fff; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 4px; }
        .admin-section.active { display: block; }

        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 3px; margin-bottom: 4px; }
        .admin-grid input, .admin-grid select { 
            padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 8px; 
            background: #ffffff; color: var(--text-main); text-align: center; width: 100%;
        }
        .admin-grid select option { background: #ffffff; color: var(--text-main); padding: 6px; }

        .btn-add { background: var(--success); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; padding: 4px; font-size: 8px; }

        .company-card { background: #ffffff; border: 1.5px solid #000; padding: 3px 6px; border-radius: 4px; margin-bottom: 2px; }
        .no-dup-table { width: 100%; border-collapse: collapse; }
        .no-dup-table td { padding: 0px 4px; border: none; vertical-align: middle; }
        
        .logo-box { width: 55px; height: 55px; border: 1.5px dashed var(--accent); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 8px; color: var(--text-secondary); background: #f8fafc; border-radius: 50%; overflow: hidden; cursor: pointer; margin: 0 auto; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .logo-hint { font-size: 5px; color: var(--danger); font-weight: 700; text-align: center; display: block; margin-top: 1px; }

        .input-group { display: flex; align-items: center; gap: 4px; width: 100%; margin-bottom: 1px; }
        .input-group label { font-size: 7px; font-weight: 700; color: var(--text-secondary); width: 55px; flex-shrink: 0; text-align: left; }
        .company-card input, .company-card select { width: 100%; padding: 1px 3px; border: 1px solid #cbd5e1; border-radius: 3px; font-size: 8px; background: #fff; font-weight: 700; color: var(--text-main); text-align: right; }
        .company-card input:read-only { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

        .actions { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 2px; justify-content: center; }
        .actions button, .actions label { flex: 1; min-width: 70px; max-width: 100px; padding: 3px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 8px; font-weight: 700; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
        .actions button.save-btn { background: var(--success); }
        .actions button.stop-btn { background: var(--danger); }
        .actions button.torch-btn { background: var(--warning); }

        #scannerContainer { width: 100%; max-width: 260px; margin: 5px auto; display: none; background: #000; border-radius: 8px; overflow: hidden; position: relative; text-align: center; border: 2px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #videoElement { width: 100%; height: 160px; object-fit: cover; display: block; }
        #canvasElement { display: none; }

        .pages-wrapper { display: flex; flex-direction: column; gap: 2px; }
        .print-page-section { display: flex; flex-direction: column; background: #fff; margin-bottom: 2px; }
        .print-company-card { display: none; }

        .grids-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.5px;
        }

        .single-grid-box { border: 1px solid #000; background: #fff; padding: 0.5px; display: flex; flex-direction: column; }

        .custom-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .custom-table th, .custom-table td {
            border: 1px solid #000; padding: 0px; text-align: center; font-size: 5px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.0;
        }
        .custom-table td:first-child { font-size: 6.5px !important; font-weight: 900 !important; color: #000 !important; background-color: #f8fafc; }
        .custom-table th { background-color: #f1f5f9; color: #000; font-weight: 900; font-size: 5.5px; height: 10px; }

        .grid-input {
            width: 100%; height: 100%; border: none; background: transparent;
            text-align: center; font-size: 6.5px; font-weight: 700; font-family: 'Cairo', sans-serif; padding: 0; margin: 0; outline: none;
        }
        .grid-input:focus { background: #eef2ff; }

        .col-num { width: 8%; }
        .col-imei { width: 46%; }
        .col-carton { width: 12%; }
        .col-model { width: 18%; }
        .col-color { width: 16%; }

        .table-responsive { width: 100%; overflow-x: auto; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; margin-bottom: 2px; }
        table { width: 100%; border-collapse: collapse; min-width: 300px; }
        
        .badge-active { background: #dcfce7; color: #166534; padding: 1px 2px; border-radius: 2px; font-size: 5px; font-weight: 700; display: inline-block; }
        .badge-expired { background: #fee2e2; color: #991b1b; padding: 1px 2px; border-radius: 2px; font-size: 5px; font-weight: 700; display: inline-block; }

        .btn-sm { padding: 1px 2px; font-size: 5px; border-radius: 2px; border: none; cursor: pointer; font-weight: 700; }
        .btn-edit-user { background: var(--accent); color: white; }
        .btn-toggle { background: var(--warning); color: white; }
        .btn-delete { background: var(--danger); color: white; }

        @media print {
            @page { size: A4 portrait; margin: 2mm; }
            .no-print, .actions, #scannerContainer, .top-bar, #adminPanel, .logo-hint, .table-responsive, #mainCompanyCard { display: none !important; }
            .print-company-card { display: block !important; }
            body, html { background: #fff !important; padding: 0 !important; margin: 0 !important; width: 210mm; height: 297mm; }
            .container { box-shadow: none !important; padding: 0 !important; width: 100% !important; border: none !important; display: block !important; margin: 0 !important; }
            .company-card { border: 1px solid #000 !important; padding: 2px 4px !important; margin-top: 0 !important; margin-bottom: 1px !important; }
            .company-card input { border: none !important; background: transparent !important; font-size: 6.5px !important; padding: 0 !important; }
            .input-group label { font-size: 6px !important; width: 48px !important; text-align: right !important; }
            .logo-box { border: 1px solid #000 !important; width: 42px !important; height: 42px !important; font-size: 4px !important; }
            .pages-wrapper { display: block !important; }
            .print-page-section { height: 288mm !important; max-height: 288mm !important; display: flex !important; flex-direction: column !important; page-break-after: always !important; page-break-inside: avoid !important; box-sizing: border-box !important; margin: 0 !important; padding: 0 !important; }
            .print-page-section:last-child { page-break-after: avoid !important; }
            .grids-container { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; grid-template-rows: repeat(3, 1fr) !important; gap: 1.5px !important; width: 100% !important; flex-grow: 1 !important; }
            .single-grid-box { border: 1px solid #000 !important; height: 100% !important; padding: 0px !important; display: flex !important; flex-direction: column !important; }
            .custom-table { height: 100% !important; }
            .custom-table th, .custom-table td { border: 1px solid #000 !important; font-size: 4.5px !important; padding: 0px !important; height: auto !important; }
            .custom-table td:first-child { font-size: 5.5px !important; font-weight: 900 !important; }
            .custom-table th { font-size: 4.5px !important; height: 8.5px !important; }
            .grid-input { border: none !important; background: transparent !important; font-size: 6px !important; font-weight: 700 !important; text-align: center !important; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h3 id="loginTitleText">🔐 بوابة دخول النظام</h3>
            <input type="text" id="loginUser" placeholder="اسم المستخدم">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <label class="remember-me" id="rememberLabel">
                <input type="checkbox" id="rememberMeCheck" checked> حفظ بيانات الدخول
            </label>
            <button type="button" id="loginBtn" onclick="handleLogin()">تسجيل الدخول</button>
            <div id="loginError">بيانات الدخول خاطئة أو الاشتراك منتهي!</div>
        </div>
    </div>

    <div class="container" id="appContainer">
        <div class="top-bar">
            <h2>⚡ نظام إدارة البيانات والباركود</h2>
            <button onclick="handleLogout()" class="logout-btn">🚪 خروج</button>
        </div>

        <div id="adminPanel">
            <h3>👑 لوحة تحكم الأدمن المركزية</h3>
            
            <div class="admin-nav-tabs">
                <button class="admin-tab-btn active" onclick="switchAdminTab(event, 'subscribersTab')">👥 إدارة المستخدمين</button>
                <button class="admin-tab-btn" onclick="switchAdminTab(event, 'settingsTab')">⚙️ إعدادات الموقع</button>
            </div>

            <div id="subscribersTab" class="admin-section active">
                <div class="admin-grid">
                    <input type="text" id="newUsername" placeholder="اسم المستخدم الجديد">
                    <input type="text" id="newPassword" placeholder="كلمة المرور">
                    <input type="date" id="newExpiry">
                    <select id="newRole">
                        <option value="user">مستخدم عادي</option>
                        <option value="admin">مدير (Admin)</option>
                    </select>
                    <button class="btn-add" onclick="addSubscriber()">+ إضافة مشترك</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>المستخدم</th>
                                <th>كلمة المرور</th>
                                <th>الانتهاء والصلاحية</th>
                                <th>الحالة والأيام</th>
                                <th>الإدارة</th>
                            </tr>
                        </thead>
                        <tbody id="subscribersTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="settingsTab" class="admin-section">
                <div class="input-group" style="margin-bottom: 4px;">
                    <label style="width: 100px;">عنوان شاشة اللوجن:</label>
                    <input type="text" id="loginTitleInput" placeholder="عنوان شاشة الدخول">
                </div>
                <div class="input-group" style="margin-bottom: 4px;">
                    <label style="width: 100px;">حالة تسجيل الدخول:</label>
                    <select id="loginStatusSelect">
                        <option value="true">إظهار اللوجن (مفعل)</option>
                        <option value="false">إخفاء اللوجن (دخول مباشر)</option>
                    </select>
                </div>
                <div class="input-group" style="margin-bottom: 6px;">
                    <label style="width: 100px;">وضع الصيانة:</label>
                    <select id="maintenanceSelect">
                        <option value="false">إيقاف وضع الصيانة (الموقع يعمل)</option>
                        <option value="true">تفعيل وضع الصيانة (إغلاق الموقع)</option>
                    </select>
                </div>
                <button class="btn-add" onclick="saveAppSettings()" style="width: 100%;">💾 حفظ إعدادات الموقع</button>
            </div>
        </div>

        <div class="company-card" id="mainCompanyCard">
            <table class="no-dup-table">
                <tr>
                    <td style="width: 37%; vertical-align: top;">
                        <div class="input-group">
                            <label>اسم المنشأة:</label>
                            <input type="text" id="compName" placeholder="اسم المنشأة" readonly oninput="syncCompanyData('compName', this.value)">
                        </div>
                        <div class="input-group">
                            <label>الرقم الضريبي:</label>
                            <input type="text" id="taxNumber" placeholder="الرقم الضريبي" readonly oninput="syncCompanyData('taxNumber', this.value)">
                        </div>
                        <div class="input-group">
                            <label>السجل التجاري:</label>
                            <input type="text" id="commercialRecord" placeholder="السجل التجاري" readonly oninput="syncCompanyData('commercialRecord', this.value)">
                        </div>
                    </td>
                    
                    <td style="width: 26%; text-align: center; vertical-align: middle;">
                        <div class="logo-box" id="logoPreview" onclick="triggerLogoUpload()">الشعار</div>
                        <input type="file" id="logoInput" accept="image/*" style="display:none;" onchange="handleLogoUpload(event)">
                        <span class="logo-hint" id="logoHintText" style="display:none;">تعديل</span>
                    </td>

                    <td style="width: 37%; vertical-align: top;">
                        <div class="input-group" style="justify-content: flex-end;">
                            <label style="text-align: right;">رقم التليفون:</label>
                            <input type="text" id="phone" placeholder="رقم التليفون" readonly style="text-align: right;" oninput="syncCompanyData('phone', this.value)">
                        </div>
                        <div class="input-group" style="justify-content: flex-end;">
                            <label style="text-align: right;">البريد الإلكتروني:</label>
                            <input type="email" id="email" placeholder="البريد الإلكتروني" readonly style="text-align: right;" oninput="syncCompanyData('email', this.value)">
                        </div>
                    </td>
                </tr>
            </table>
        </div>

        <div class="actions">
            <button onclick="saveCompanySettings()" class="no-print save-btn" id="saveCompanyBtn" style="display:none;">💾 حفظ التعديلات</button>
            <button onclick="startAdvancedScanner()" class="no-print" id="scanBtn" style="background: var(--success);">📷 الكاميرا الذكية</button>
            <button onclick="toggleFlashlight()" class="no-print torch-btn" id="torchBtn" style="display:none;">🔦 الفلاش</button>
            <button onclick="stopAdvancedScanner()" class="no-print stop-btn" id="stopBtn" style="display:none;">✕ إغلاق</button>
            
            <label for="galleryBarcode" class="no-print" style="cursor: pointer;">
                📁 رفع من المعرض
                <input type="file" id="galleryBarcode" accept="image/*" style="display: none;" onchange="readBarcodeFromFile(event)">
            </label>

            <button onclick="triggerPrint()" class="no-print" style="background:var(--accent);">🖨️ طباعة / PDF</button>
        </div>

        <div id="scannerContainer" class="no-print">
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="canvasElement"></canvas>
            <div style="background: rgba(0,0,0,0.85); color: #4ade80; font-size: 7px; padding: 3px; font-weight: bold;">
                ⚡ جاهز لالتقاط الباركود
            </div>
        </div>

        <div class="pages-wrapper" id="pagesWrapperContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gwpgfwytwiitzbuupqvw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3cGdmd3l0d2lpdHpidXVwcXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjQ5ODksImV4cCI6MjEwNTc0MDk4OX0.2X5J8Wj1Qfj1-q9ExwG8AnoXpA6mqLXfrAOuQiNNye4';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let targetManagedUser = null;
        let currentLogoBase64 = '';
        let scannedSerials = [];
        let tableModels = {}; 
        let tableColors = {}; 
        
        let mediaStream = null;
        let scanInterval = null;
        let torchOn = false;
        let barcodeDetector = null;

        let scannerBuffer = '';
        let lastKeyTime = Date.now();

        // متغيرات الاستشعار الحي
        let globalMaintenanceSetting = 'false';
        let globalLoginStatusSetting = 'true';

        window.addEventListener('keydown', function(e) {
            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 150) scannerBuffer = '';
            lastKeyTime = currentTime;

            if (e.key === 'Enter') {
                if (scannerBuffer.trim().length > 1) {
                    e.preventDefault();
                    playSuccessFeedback();
                    addSerialToTable(scannerBuffer.trim());
                    scannerBuffer = '';
                }
            } else if (e.key.length === 1) {
                scannerBuffer += e.key;
            }
        });

        function playSuccessFeedback() {
            if (navigator.vibrate) navigator.vibrate(100);
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        // ==========================================
        // نواة النظام: الفحص الحي بدون ريفرش
        // ==========================================
        async function checkSettingsPeriodically() {
            try {
                const { data: settingsData, error } = await _supabase.from('app_settings').select('*');
                if (error || !settingsData) return;

                settingsData.forEach(item => {
                    if (item.setting_key === 'enable_login') {
                        globalLoginStatusSetting = item.setting_value;
                        const selEl = document.getElementById('loginStatusSelect');
                        if (selEl && selEl.value !== item.setting_value) selEl.value = item.setting_value;
                    }
                    if (item.setting_key === 'maintenance_mode') {
                        globalMaintenanceSetting = item.setting_value;
                        const maintEl = document.getElementById('maintenanceSelect');
                        if (maintEl && maintEl.value !== item.setting_value) maintEl.value = item.setting_value;
                    }
                    if (item.setting_key === 'login_title' && item.setting_value) {
                        const titleEl = document.getElementById('loginTitleText');
                        if (titleEl && titleEl.innerText !== item.setting_value) titleEl.innerText = item.setting_value;
                        const inputEl = document.getElementById('loginTitleInput');
                        if (inputEl && inputEl.value !== item.setting_value) inputEl.value = item.setting_value;
                    }
                });

                evaluateSystemState();
            } catch (e) {}
        }

        async function evaluateSystemState() {
            const isCurrentAdmin = (currentUser && currentUser.role === 'admin');
            const bypassEnabled = String(globalLoginStatusSetting) === 'false';
            const maintenanceEnabled = String(globalMaintenanceSetting) === 'true';

            // 1. نظام وضع الصيانة (يطبق فورا)
            if (maintenanceEnabled) {
                if (!isCurrentAdmin) {
                    showMaintenanceScreen();
                }
                return; 
            }

            // 2. الوضع الطبيعي 
            if (!maintenanceEnabled) {
                
                // استعادة شاشة اللوجن لو كانت معلقة بسبب الصيانة
                if (document.getElementById('loginOverlay').style.display !== 'none' && !currentUser && !bypassEnabled) {
                    showNormalLoginScreen();
                }

                // أ- إخفاء اللوجن (الدخول الفوري الذكي)
                if (bypassEnabled) {
                    if (!currentUser && !sessionStorage.getItem('admin_reveal')) {
                        await executeBypassLogin();
                    }
                }
                
                // ب- إظهار اللوجن (طرد المتخطيين فورا)
                if (!bypassEnabled) {
                    if (currentUser && currentUser.is_bypassed) {
                        silentLogout(); 
                    } else if (!currentUser && document.getElementById('loginOverlay').style.display === 'none') {
                        showNormalLoginScreen();
                    }
                }
            }
        }

        function showMaintenanceScreen() {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';

            if (savedUser && savedPass) {
                try {
                    const { data: checkAdmin } = await _supabase.from('subscriptions').select('*').eq('username', savedUser).eq('password', savedPass).maybeSingle();
                    if (checkAdmin && checkAdmin.role === 'admin') {

        async function startAdvancedScanner() {
            document.getElementById('scannerContainer').style.display = 'block';
            document.getElementById('scanBtn').style.display = 'none';
            document.getElementById('torchBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'inline-block';

            if (!('BarcodeDetector' in window)) {
                alert("عذراً، متصفحك الحالي لا يدعم محرك قراءة الباركود المتطور.");
                return;
            }

            if (!barcodeDetector) {
                try {
                    barcodeDetector = new BarcodeDetector({
                        formats: ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'pdf417', 'qr_code', 'data_matrix']
                    });
                } catch (e) {
                    barcodeDetector = new BarcodeDetector();
                }
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                const videoEl = document.getElementById('videoElement');
                videoEl.srcObject = mediaStream;
                videoEl.play();

                const canvas = document.getElementById('canvasElement');
                const ctx = canvas.getContext('2d');

                scanInterval = setInterval(async () => {
                    if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA && barcodeDetector) {
                        canvas.width = videoEl.videoWidth;
                        canvas.height = videoEl.videoHeight;
                        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

                        try {
                            const barcodes = await barcodeDetector.detect(canvas);
                            if (barcodes.length > 0) {
                                const detectedText = barcodes[0].rawValue;
                                if (detectedText) {
                                    playSuccessFeedback();
                                    addSerialToTable(detectedText);
                                    stopAdvancedScanner();
                                }
                            }
                        } catch (err) {}
                    }
                }, 100);

            } catch (err) {
                alert("تعذر تشغيل الكاميرا، تأكد من إعطاء الصلاحيات.");
                stopAdvancedScanner();
            }
        }

        async function toggleFlashlight() {
            if (!mediaStream) return;
            try {
                const track = mediaStream.getVideoTracks()[0];
                torchOn = !torchOn;
                await track.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });
                const btn = document.getElementById('torchBtn');
                btn.style.background = torchOn ? 'var(--success)' : 'var(--warning)';
                btn.innerText = torchOn ? '💡 إطفاء الفلاش' : '🔦 الفلاش';
            } catch (e) {
                torchOn = false;
            }
        }

        function stopAdvancedScanner() {
            if (scanInterval) clearInterval(scanInterval);
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('scannerContainer').style.display = 'none';
            document.getElementById('scanBtn').style.display = 'inline-block';
            document.getElementById('torchBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            torchOn = false;
        }

        async function readBarcodeFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const img = new Image();
                img.onload = async function() {
                    if ('BarcodeDetector' in window) {
                        try {
                            const detector = new BarcodeDetector();
                            const barcodes = await detector.detect(img);
                            if (barcodes.length > 0 && barcodes[0].rawValue) {
                                playSuccessFeedback();
                                addSerialToTable(barcodes[0].rawValue);
                                return;
                            }
                        } catch(err) {}
                    }
                    alert("لم يتم التعرف على الكود من الصورة، حاول التقاط صورة أوضح.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function addSerialToTable(codeText) {
            if (!codeText) return;
            let rawItems = codeText.split(/\r?\n|,|\t|;|\s+/).map(item => item.trim()).filter(item => item !== "");
            let validItems = [];
            rawItems.forEach(item => {
                let cleanItem = item.replace(/[^a-zA-Z0-9]/g, '');
                if (cleanItem.length >= 3) validItems.push(cleanItem);
            });
            if (validItems.length === 0) validItems.push(codeText.trim());

            validItems.forEach(item => { scannedSerials.push(item); });
            renderAllPages();
        }

                            <tbody>
                    `;

                    for (let rowIdx = 1; rowIdx <= 21; rowIdx++) {
                        const globalIndex = (pageIdx * itemsPerPage) + ((gridIdx - 1) * 21) + (rowIdx - 1);
                        const serialValue = scannedSerials[globalIndex] || '';
                        const modelValue = tableModels[globalIndex] || '';
                        const colorValue = tableColors[globalIndex] || '';

                        if (rowIdx === 1) {
                            tableHTML += `
                                <tr>
                                    <td>${rowIdx}</td>
                                    <td style="text-align:center; padding:0; vertical-align:middle;"><input type="text" class="grid-input" value="${serialValue}" oninput="updateSerialVal(${globalIndex}, this.value)"></td>
                                    <td rowspan="21" style="vertical-align: middle; text-align: center; font-weight: 900; font-size: 6.5px;">${absoluteGridNumber}</td>
                                    <td><input type="text" class="grid-input" value="${modelValue}" oninput="updateModelVal(${globalIndex}, this.value)"></td>
                                    <td><input type="text" class="grid-input" value="${colorValue}" oninput="updateColorVal(${globalIndex}, this.value)"></td>
                                </tr>
                            `;
                        } else {
                            tableHTML += `
                                <tr>
                                    <td>${rowIdx}</td>
                                    <td style="text-align:center; padding:0; vertical-align:middle;"><input type="text" class="grid-input" value="${serialValue}" oninput="updateSerialVal(${globalIndex}, this.value)"></td>
                                    <td><input type="text" class="grid-input" value="${modelValue}" oninput="updateModelVal(${globalIndex}, this.value)"></td>
                                    <td><input type="text" class="grid-input" value="${colorValue}" oninput="updateColorVal(${globalIndex}, this.value)"></td>
                                </tr>
                            `;
                        }
                    }
                    tableHTML += `</tbody></table>`;
                    boxDiv.innerHTML = tableHTML;
                    gridContainer.appendChild(boxDiv);
                }
                pageSection.pagesWrapper ? '' : pageSection.appendChild(gridContainer);
                wrapper.appendChild(pageSection);
            }
        }
    </script>
</body>
</html>
